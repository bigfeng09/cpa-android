<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>鹈鹕骑行记</title>
  <style>
    :root {
      --ink: #17313b;
      --teal: #1f9a96;
      --coral: #ef765f;
      --sun: #ffd166;
      --cream: #fff8ec;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      padding: 18px;
      overflow: hidden;
      background: #17313b;
      color: var(--ink);
      font-family: "Trebuchet MS", "Microsoft YaHei", sans-serif;
    }
    .scene {
      position: relative;
      width: min(1100px, 100%);
      aspect-ratio: 16 / 10;
      overflow: hidden;
      border: 7px solid var(--cream);
      border-radius: 18px;
      background: #8bd8db;
      box-shadow: 0 20px 55px rgba(0, 0, 0, .25);
    }
    svg { display: block; width: 100%; height: 100%; }
    .title {
      position: absolute;
      left: 28px;
      top: 20px;
      margin: 0;
      font-size: clamp(18px, 3.2vw, 33px);
      letter-spacing: 1px;
      color: var(--ink);
      text-shadow: 0 2px 0 rgba(255,255,255,.75);
      pointer-events: none;
    }
    .subtitle {
      position: absolute;
      left: 30px;
      top: 64px;
      margin: 0;
      font-size: clamp(11px, 1.45vw, 15px);
      color: #2a5a63;
      pointer-events: none;
    }
    .controls {
      position: absolute;
      right: 18px;
      top: 18px;
      display: flex;
      gap: 8px;
    }
    button {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 2px solid var(--ink);
      border-radius: 999px;
      padding: 8px 13px;
      background: rgba(255,248,236,.92);
      color: var(--ink);
      font: 600 13px inherit;
      cursor: pointer;
      transition: transform .2s ease, background .2s ease;
    }
    button:hover { transform: translateY(-2px); background: #fff; }
    button:active { transform: translateY(0); }
    .icon { width: 14px; height: 14px; display: inline-grid; place-items: center; }
    .cloud { animation: drift 24s linear infinite; }
    .cloud.slow { animation-duration: 34s; animation-delay: -9s; }
    .grass { animation: sway 3.2s ease-in-out infinite alternate; transform-origin: bottom; }
    .grass.g2 { animation-delay: -1s; animation-duration: 2.7s; }
    .rider { animation: bob .72s ease-in-out infinite; transform-origin: 520px 440px; }
    .wing { animation: wing .8s ease-in-out infinite alternate; transform-origin: 535px 275px; }
    .leg.back { animation: pedalBack 1.2s linear infinite; transform-origin: 514px 384px; }
    .leg.front { animation: pedalFront 1.2s linear infinite; transform-origin: 514px 384px; }
    .pedal { animation: pedalSpin 1.2s linear infinite; transform-origin: 514px 384px; }
    .wheel-spin { animation: wheel 1.2s linear infinite; transform-origin: center; }
    .road-dash { animation: road 1.1s linear infinite; }
    .beak-tip { animation: beak .9s ease-in-out infinite alternate; transform-origin: 600px 252px; }
    .paused * { animation-play-state: paused !important; }
    @keyframes drift { from { transform: translateX(-60px); } to { transform: translateX(1140px); } }
    @keyframes sway { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes wing { from { transform: rotate(3deg); } to { transform: rotate(-8deg); } }
    @keyframes pedalBack { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes pedalFront { from { transform: rotate(180deg); } to { transform: rotate(540deg); } }
    @keyframes pedalSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes wheel { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }
    @keyframes road { from { transform: translateX(0); } to { transform: translateX(-110px); } }
    @keyframes beak { from { transform: rotate(0deg); } to { transform: rotate(3deg); } }
    @media (max-width: 640px) {
      body { padding: 8px; }
      .scene { border-width: 4px; border-radius: 12px; }
      .title { left: 15px; top: 12px; }
      .subtitle { left: 16px; top: 46px; }
      .controls { right: 10px; top: 10px; }
      button { padding: 7px 10px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <main class="scene" id="scene" aria-label="鹈鹕骑自行车的二维动画">
    <h1 class="title">鹈鹕骑行记</h1>
    <p class="subtitle">海风正好，出发去看日落</p>
    <div class="controls">
      <button id="toggle" type="button" aria-pressed="false">
        <span class="icon" id="toggleIcon">❚❚</span><span id="toggleLabel">暂停</span>
      </button>
    </div>
    <svg viewBox="0 0 1100 680" role="img" aria-labelledby="svgTitle svgDesc">
      <title id="svgTitle">一只鹈鹕骑着自行车穿过海边小路</title>
      <desc id="svgDesc">天空、云朵、海面和棕榈树组成背景，鹈鹕踩着踏板前进。</desc>
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#8bd8db"/><stop offset=".65" stop-color="#d9f2df"/><stop offset="1" stop-color="#ffe2a7"/>
        </linearGradient>
        <linearGradient id="sea" x1="0" y1="0" x2="1" y2="0">
          <stop stop-color="#59bfc5"/><stop offset="1" stop-color="#4ba5be"/>
        </linearGradient>
        <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
      </defs>
      <rect width="1100" height="680" fill="url(#sky)"/>
      <circle cx="905" cy="170" r="84" fill="#ffd166" opacity=".9"/>
      <circle cx="905" cy="170" r="107" fill="none" stroke="#ffd166" stroke-width="2" opacity=".3"/>
      <g class="cloud" fill="#fffaf0" opacity=".9">
        <path d="M-110 147c30-38 77-35 98-3 18-38 82-35 96 8 35-14 70 9 70 43H-120c-12-18-8-35 10-48z"/>
      </g>
      <g class="cloud slow" fill="#fffaf0" opacity=".7">
        <path d="M710 93c22-29 59-27 75-3 15-32 68-27 79 10 28-11 56 7 57 36H690c-10-17-4-32 20-43z"/>
      </g>
      <path d="M0 348 Q170 318 360 344 T720 339 T1100 347 V512 H0Z" fill="url(#sea)"/>
      <path d="M0 388 Q180 368 370 389 T750 384 T1100 390" fill="none" stroke="#a7e8e0" stroke-width="8" opacity=".7"/>
      <path d="M0 430 Q160 413 330 431 T650 428 T1100 433" fill="none" stroke="#d8f7e6" stroke-width="5" opacity=".65"/>
      <path d="M0 448 Q210 428 420 448 T800 443 T1100 447 V680 H0Z" fill="#f4c978"/>
      <path d="M0 500 Q220 478 430 500 T850 496 T1100 498 V680 H0Z" fill="#9acb78"/>
      <path d="M0 558H1100V680H0Z" fill="#445f55"/>
      <g class="road-dash" fill="#f5d98b" opacity=".9">
        <rect x="20" y="608" width="75" height="8" rx="4"/><rect x="160" y="608" width="75" height="8" rx="4"/><rect x="300" y="608" width="75" height="8" rx="4"/><rect x="440" y="608" width="75" height="8" rx="4"/><rect x="580" y="608" width="75" height="8" rx="4"/><rect x="720" y="608" width="75" height="8" rx="4"/><rect x="860" y="608" width="75" height="8" rx="4"/><rect x="1000" y="608" width="75" height="8" rx="4"/>
      </g>
      <g class="grass" stroke="#4a875c" stroke-width="4" stroke-linecap="round">
        <path d="M85 560l-9-24m11 24l11-28m-5 28l19-20M180 552l-8-29m12 29l13-24m-6 24l21-18M967 557l-8-27m12 27l14-30m-5 30l23-21"/>
      </g>
      <g class="grass g2" stroke="#5a9960" stroke-width="4" stroke-linecap="round">
        <path d="M760 548l-8-28m13 28l14-26m-7 26l19-18M1020 546l-8-25m14 25l13-28m-5 28l18-20"/>
      </g>
      <g transform="translate(900 365)" opacity=".9">
        <path d="M0 110V-8" stroke="#744f3c" stroke-width="14" stroke-linecap="round"/>
        <path d="M0 0C-52-45-73-82-83-115M0 9C48-41 71-72 81-111M0 21C-20-35-26-78-21-126M0 25C27-22 42-65 47-119" fill="none" stroke="#3e8d64" stroke-width="18" stroke-linecap="round"/>
      </g>
      <g class="rider">
        <ellipse cx="520" cy="527" rx="178" ry="19" fill="#223d43" opacity=".22" filter="url(#soft)"/>
        <g stroke="#17313b" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M407 500L514 384L608 501L407 500M514 384L608 501M514 384L514 355M514 355h-30" stroke="#ef765f"/>
          <path d="M608 501L634 463M618 458l33 4"/>
        </g>
        <g class="wheel-spin" fill="none" stroke="#17313b" stroke-width="8">
          <circle cx="407" cy="500" r="67" fill="#fef8ec"/>
          <circle cx="608" cy="501" r="67" fill="#fef8ec"/>
          <path d="M407 500l45-49m-45 49l57 20m-57-20l-12-63m12 63l-55 26m55-26l6 66M608 501l-42-48m42 48l-57 21m57-21l12-63m-12 63l54 26m-54-26l-5 65" stroke="#5d8990" stroke-width="3"/>
        </g>
        <g stroke="#17313b" stroke-width="7" stroke-linecap="round" fill="none">
          <path class="leg back" d="M516 336q-12 36-4 62l-26 35"/>
          <path class="leg front" d="M516 336q18 35 9 60l28 29"/>
        </g>
        <g class="pedal" stroke="#17313b" stroke-width="5" stroke-linecap="round">
          <circle cx="514" cy="384" r="10" fill="#ffd166"/>
          <path d="M514 384l-25 19m25-19l27-18"/>
          <path d="M489 403h-18m45-37h18"/>
        </g>
        <path d="M484 337q-18-44 6-77 25-34 71-19 33 11 41 53 8 42-24 61-55 33-94-18z" fill="#f3f0df" stroke="#17313b" stroke-width="7"/>
        <path d="M499 283q28-45 76-31 16 5 27 22-4-42-34-56-50-23-80 16-23 30-4 68z" fill="#d9d8c7"/>
        <ellipse cx="572" cy="259" rx="17" ry="20" fill="#17313b"/>
        <circle cx="578" cy="252" r="5" fill="#fff8ec"/>
        <path d="M591 274q49 5 66-13 12-14 30-4-11 18-34 30-33 17-63 6z" fill="#f2a24a" stroke="#17313b" stroke-width="7"/>
        <path class="beak-tip" d="M686 258q19-2 28 6-14 11-31 8z" fill="#e77a48" stroke="#17313b" stroke-width="5"/>
        <path d="M571 291q25 24 20 51-7 35-32 41-34 7-57-31-12-20-6-45 23 23 75-16z" fill="#d3d1be" stroke="#17313b" stroke-width="7"/>
        <path d="M527 342q-12 34 11 47t48-8" fill="none" stroke="#ef765f" stroke-width="12" stroke-linecap="round"/>
        <path class="wing" d="M539 296q25-28 59 2 22 20 31 55-27 12-51-4-30-20-39-53z" fill="#ece9d7" stroke="#17313b" stroke-width="7"/>
        <path d="M537 318q26-7 56 26" fill="none" stroke="#b7b7aa" stroke-width="5" stroke-linecap="round"/>
        <path d="M531 370q-26 25-38 48" fill="none" stroke="#17313b" stroke-width="7" stroke-linecap="round"/>
        <path d="M494 418h-24m24 0l17 9" stroke="#17313b" stroke-width="7" stroke-linecap="round"/>
      </g>
      <g transform="translate(255 421)">
        <path d="M0 112V20" stroke="#7f5739" stroke-width="11" stroke-linecap="round"/>
        <path d="M0 38C-42 8-55-18-60-49M0 50C41 17 59-11 63-47M0 58C-16 19-19-9-12-59M0 63C26 27 36 1 39-56" fill="none" stroke="#4f9b68" stroke-width="15" stroke-linecap="round"/>
      </g>
      <g fill="#fff8ec" opacity=".8">
        <path d="M170 284q30-26 61 0-31 17-61 0z"/><path d="M780 302q25-22 50 0-25 14-50 0z"/>
      </g>
    </svg>
  </main>
  <script>
    const scene = document.getElementById('scene');
    const toggle = document.getElementById('toggle');
    const icon = document.getElementById('toggleIcon');
    const label = document.getElementById('toggleLabel');
    toggle.addEventListener('click', () => {
      const paused = scene.classList.toggle('paused');
      toggle.setAttribute('aria-pressed', String(paused));
      icon.textContent = paused ? '▶' : '❚❚';
      label.textContent = paused ? '继续' : '暂停';
    });
  </script>
</body>
</html>
